services:
  gonic:
    image: sentriz/gonic:latest
    container_name: gonic
    restart: unless-stopped
    user: "${GONIC_UID:-1000}:${GONIC_GID:-1000}"
    environment:
      GONIC_LISTEN_ADDR: ":4747"
      GONIC_MUSIC_PATH: /music
      GONIC_PODCAST_PATH: /podcasts
      GONIC_PLAYLISTS_PATH: /playlists
      GONIC_CACHE_PATH: /cache
      GONIC_DB_PATH: /data/gonic.db
      GONIC_SCAN_INTERVAL: "${GONIC_SCAN_INTERVAL:-60}"
      GONIC_SCAN_AT_START_ENABLED: "true"
      GONIC_SCAN_WATCHER_ENABLED: "true"
    volumes:
      - /srv/gonic/data:/data
      - /srv/gonic/cache:/cache
      - /srv/gonic/music:/music:ro
      - /srv/gonic/podcasts:/podcasts
      - /srv/gonic/playlists:/playlists
    ports:
      - "${GONIC_HTTP_BIND:-4747}:4747"

  gonic-music-nfs:
    image: erichough/nfs-server:latest
    container_name: gonic-music-nfs
    restart: unless-stopped
    privileged: true
    environment:
      NFS_DISABLE_VERSION_3: "1"
      NFS_EXPORT_0: "/exports/music ${GONIC_NFS_ALLOWED:-192.168.2.0/24}(rw,fsid=0,sync,no_subtree_check,insecure)"
    volumes:
      - /srv/gonic/music:/exports/music
      - /run/booted-system/kernel-modules/lib/modules:/lib/modules:ro
    ports:
      - "${GONIC_NFS_BIND:-2049}:2049/tcp"
