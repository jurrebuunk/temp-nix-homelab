services:
  gonic:
    image: sentriz/gonic:latest
    container_name: gonic
    restart: unless-stopped
    user: "${GONIC_UID:-1000}:${GONIC_GID:-1000}"
    command:
      - -listen-addr
      - :4747
      - -music-path
      - /music
      - -podcast-path
      - /podcasts
      - -cache-path
      - /cache
      - -db-path
      - /data/gonic.db
      - -scan-interval
      - ${GONIC_SCAN_INTERVAL:-60}
    volumes:
      - /srv/gonic/data:/data
      - /srv/gonic/cache:/cache
      - /srv/gonic/music:/music:ro
      - /srv/gonic/podcasts:/podcasts
    ports:
      - "${GONIC_HTTP_BIND:-4747}:4747"

  gonic-music-nfs:
    image: erichough/nfs-server:latest
    container_name: gonic-music-nfs
    restart: unless-stopped
    privileged: true
    environment:
      NFS_DISABLE_VERSION_3: "1"
      NFS_EXPORT_0: "/exports/music ${GONIC_NFS_ALLOWED:-192.168.2.0/24}(rw,fsid=0,sync,no_subtree_check)"
    volumes:
      - /srv/gonic/music:/exports/music
    ports:
      - "${GONIC_NFS_BIND:-2049}:2049/tcp"
