name: NixOS Check

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  validate:
    name: Validate NixOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose files
        run: |
          shopt -s globstar nullglob
          files=(services/**/compose.yml services/**/compose.yaml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Compose files found"
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"
            TUNNEL_TOKEN=dummy docker compose --file "$file" config --quiet
          done

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Build server configuration
        run: |
          nix build \
            .#nixosConfigurations.server.config.system.build.toplevel \
            --no-link